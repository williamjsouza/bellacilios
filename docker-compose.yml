# Referência para EasyPanel / Docker local.
# No EasyPanel: App → Source GitHub → Build Dockerfile → Porta 3000
# Monte um volume em /app/db para persistir o SQLite.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/db/custom.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-altere-este-segredo}
    volumes:
      - bella-db:/app/db
    restart: unless-stopped

volumes:
  bella-db:
